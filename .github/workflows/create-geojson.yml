name: Create IEAT GeoJSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-geojson:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create clean GeoJSON
        run: python update_station.py

      - name: Commit generated GeoJSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add station.geojson

          if git diff --cached --quiet; then
            echo "No GeoJSON changes"
          else
            git commit -m "Update IEAT station GeoJSON"
            git push
          fi
